<!doctype html>
<!--
  ACTIVITY ARCHIVE TEMPLATE — copy to projects/_activity/<name>.html when you create a project.
  Full activity log for one project, newest first. /close-up prepends rolled-off entries at archive:top.
  Note the stylesheet path is ../_style.css (one level up from _activity/).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} · activity log</title>
<link rel="stylesheet" href="../_style.css">
</head>
<body>
<main class="wrap">

<header class="head">
  <h1>{{NAME}} · activity</h1>
  <p class="tag">Full activity log, newest first. Current status lives on the <a href="../{{NAME}}.html">project page</a>.</p>
</header>

<section>
  <!-- archive:top -->
  <!-- /close-up prepends here the entry it rolls off the project page's recent window -->
  <p class="foot">No archived entries yet — the recent window on the project page still holds all activity.</p>
</section>

</main>
</body>
</html>
